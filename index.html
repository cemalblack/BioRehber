<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BiyoRehber: 6 Kriter & Emilim</title>

  <!-- PWA & Mobil Uygulama Meta Etiketleri (2. Adımdaki dosyalarla otomatik bağlanır) -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BiyoRehber" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-card-alt: #26354d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #059669;
      --accent: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --purple: #a855f7;
      --border: #334155;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    body.light-mode {
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-alt: #f8fafc;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #059669;
      --primary-dark: #047857;
      --accent: #d97706;
      --danger: #dc2626;
      --info: #2563eb;
      --purple: #7e22ce;
      --border: #cbd5e1;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 85px;
      overflow-x: hidden;
    }

    /* Üst Sabit Başlık ve Arama */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
      backdrop-filter: blur(10px);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-badge {
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
    }

    .cart-count {
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 99px;
    }

    .search-bar {
      position: relative;
      width: 100%;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 36px 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
    }

    /* Yatay Kaydırılabilir Kategori Çipleri */
    .chips-wrapper {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 14px;
      scrollbar-width: none;
      background: var(--bg);
      position: sticky;
      top: 97px;
      z-index: 90;
      border-bottom: 1px solid var(--border);
    }

    .chips-wrapper::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .chip.trap-chip.active {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* Ana İçerik Alanı */
    main {
      padding: 12px 14px;
      max-width: 720px;
      margin: 0 auto;
    }

    .section-banner {
      background: var(--bg-card-alt);
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .section-banner strong {
      color: var(--text);
    }

    /* Gıda ve Molekül Kartları */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card.trap-card {
      border-left: 4px solid var(--danger);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-title-area {
      flex: 1;
    }

    .category-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 5px;
      margin-bottom: 4px;
      background: var(--bg-card-alt);
      color: var(--primary);
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .score-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 0.73rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .multiplier-badge {
      background: rgba(245, 158, 11, 0.18);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .add-cart-btn {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .add-cart-btn.in-cart {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Bilgi Kutuları */
    .info-box {
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 0.86rem;
    }

    .box-surprise {
      background: rgba(245, 158, 11, 0.12);
      border-left: 3px solid var(--accent);
    }

    .box-pick {
      background: rgba(59, 130, 246, 0.12);
      border-left: 3px solid var(--info);
    }

    .box-right {
      background: rgba(16, 185, 129, 0.12);
      border-left: 3px solid var(--primary);
    }

    .box-wrong {
      background: rgba(239, 68, 68, 0.12);
      border-left: 3px solid var(--danger);
    }

    .box-storage {
      background: var(--bg-card-alt);
      border-left: 3px solid var(--purple);
    }

    .box-label {
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
      letter-spacing: 0.3px;
    }

    /* Etken Madde Etiketleri */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .compound-tag {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 99px;
      cursor: pointer;
    }

    .compound-tag:hover, .compound-tag:active {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Alt Navigasyon Barı */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn .nav-icon {
      font-size: 1.3rem;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    /* Alışveriş Sepeti Çekmecesi (Modal) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 600px;
      max-height: 82vh;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-card-alt);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .cart-item.checked span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Üst Bar -->
  <header>
    <div class="header-top">

    const chipsContainer = document.getElementById("chipsContainer");

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const cartCountEl = document.getElementById("cartCount");

    function saveCart() {
      localStorage.setItem("biyoRehberCart", JSON.stringify(shoppingCart));
      updateCartBadge();
    }

    function updateCartBadge() {
      cartCountEl.textContent = shoppingCart.length;
    }

    function toggleCartItem(foodId, foodName) {
      const idx = shoppingCart.findIndex(item => item.id === foodId);
      if (idx > -1) {
        shoppingCart.splice(idx, 1);
      } else {
        shoppingCart.push({ id: foodId, name: foodName, checked: false });
      }
      saveCart();
      renderMain();
    }

    function renderChips() {
      const filters = TAB_FILTERS[currentTab];
      chipsContainer.innerHTML = filters.map(f => {
        const isTrap = f.includes("Tuzak");
        const activeClass = f === activeFilter ? "active" : "";
        const trapClass = isTrap ? "trap-chip" : "";
        return `<button class="chip ${activeClass} ${trapClass}" data-filter="${f}">${f}</button>`;
      }).join("");

      chipsContainer.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          activeFilter = btn.getAttribute("data-filter");
          renderChips();
          renderMain();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function matchesSearch(item) {
      if (!searchQuery) return true;
      const q = searchQuery.toLocaleLowerCase("tr-TR");
      const hay = JSON.stringify(item).toLocaleLowerCase("tr-TR");
      return hay.includes(q);
    }

    function jumpToMolecule(molName) {
      currentTab = "targets";
      activeFilter = "Tümü";
      searchQuery = molName;
      searchInput.value = molName;
      clearSearchBtn.style.display = "block";
      updateNavButtons();
      renderChips();
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function jumpToFood(foodId) {
      const food = FOODS_DB.find(f => f.id === foodId);
      if (!food) return;
      currentTab = "kitchen";
      activeFilter = "Tümü";
      searchQuery = food.name.split(" ")[0];
      searchInput.value = searchQuery;
      clearSearchBtn.style.display = "block";
      updateNavButtons();
      renderChips();
      renderMain();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

      let html = `
        <div class="section-banner">
          <strong>🍳 Mutfak & Biyoyararlanım Modu:</strong> Tabaktaki besinin çöpe gitmeyip kana geçmesini 3 ila 20 katına çıkaran doğrama, pişirme, eşleştirme ve saklama kuralları.
        </div>
      `;

      html += items.map(item => `
        <div class="card">
          <span class="category-tag">${item.kitchenCategory} • ${item.category}</span>
          <div class="card-title" style="margin-bottom:6px;">${item.name}</div>
          <div class="multiplier-badge">🚀 ${item.multiplierBadge}</div>

          <div class="info-box box-right">
            <span class="box-label" style="color:var(--primary);">✅ Doğru Mutfak & Emilim Protokolü</span>
            ${item.rightMethod.replace(/\n/g, "<br>")}
          </div>

          <div class="info-box box-wrong">
            <span class="box-label" style="color:var(--danger);">❌ Yaygın Hata (Bunu Yapma!)</span>
            ${item.wrongMethod}
          </div>

          <div class="info-box box-storage">
            <span class="box-label" style="color:var(--purple);">❄️ Saklama & Sıfır Fire Kuralı</span>
            ${item.storage}
          </div>
        </div>
      `).join("");

      mainContent.innerHTML = html || `<div class="empty-state">Aramanızla eşleşen mutfak kuralı bulunamadı.</div>`;
    }

    function renderTargetsTab() {
      const systemFilters = [
        "Damar & Kolajen",
        "Beyin & Odaklanma",
        "Bağırsak & Sindirim",
        "İltihap Düşürme",
        "Kas & Net Protein",
        "Bağışıklık & Senolitik",
        "Göz & Retina"
      ];

      if (systemFilters.includes(activeFilter)) {
        const matchingFoods = FOODS_DB.filter(f => f.systems.includes(activeFilter) && matchesSearch(f));
        let html = `
          <div class="section-banner">
            <strong>🩺 Hedef Sistem (${activeFilter}):</strong> Bu vücut sistemini doğrudan onaran ve 6 pratiklik kriterini geçen en güçlü gıdalar.
          </div>
        `;
        html += matchingFoods.map(f => `
          <div class="card">
            <span class="category-tag">${f.category} • ${activeFilter}</span>
            <div class="card-title">${f.name} <span class="score-badge">${f.score} Puan</span></div>
            <div class="info-box box-surprise">
              <span class="box-label" style="color:var(--accent);">Biyolojik Etkisi</span>
              ${f.surprise}
            </div>
            <div class="info-box box-right">
              <span class="box-label" style="color:var(--primary);">Nasıl Tüketilmeli? (${f.multiplierBadge})</span>
              ${f.rightMethod.replace(/\n/g, "<br>")}
            </div>
          </div>
        `).join("");
        mainContent.innerHTML = html || `<div class="empty-state">Sonuç bulunamadı.</div>`;
        return;
      }

      let mols = MOLECULES_DB.filter(m => {
        const typeMatch = activeFilter === "Tümü" || m.type === activeFilter;
        return typeMatch && matchesSearch(m);
      });

      let html = `
        <div class="section-banner">
          <strong>🎯 Vitamin, Mineral ve Etken Madde Rehberi:</strong> Hangi molekül vücutta ne işe yarar ve 6 kriteri geçen en pratik şampiyon kaynakları hangileridir? (Gıda etiketine basarak mutfak kuralına gidebilirsin).
        </div>
      `;

      html += mols.map(m => {
        const sourceButtons = m.sources.map(srcId => {
          const found = FOODS_DB.find(f => f.id === srcId);
          return found
            ? `<span class="compound-tag" style="border-color:var(--primary);" onclick="jumpToFood('${found.id}')">🥗 ${found.name} →</span>`
            : "";
        }).join("");

        return `
          <div class="card">
            <span class="category-tag">${m.type}</span>
            <div class="card-title" style="margin-bottom:6px;">🧬 ${m.name}</div>
            <div class="info-box box-pick">
              <span class="box-label" style="color:var(--info);">Vücuttaki Görevi (Ne İşe Yarar?)</span>
              ${m.role}
            </div>
            <div class="info-box box-right">
              <span class="box-label" style="color:var(--primary);">🔑 Kritik Emilim & Kaynak Kuralı</span>
              ${m.tip}
            </div>
            <div class="tags-row">
              <span style="font-size:0.75rem; color:var(--text-muted); width:100%; font-weight:700;">ŞAMPİYON KAYNAKLAR (Tıkla & Mutfak Kuralını Gör):</span>
              ${sourceButtons}
            </div>
          </div>
        `;
      }).join("");

      mainContent.innerHTML = html || `<div class="empty-state">Aramanızla eşleşen etken madde bulunamadı.</div>`;
    }

    function renderMain() {
      if (currentTab === "shopping") renderShoppingTab();
      else if (currentTab === "kitchen") renderKitchenTab();
      else if (currentTab === "targets") renderTargetsTab();
    }

    function updateNavButtons() {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === currentTab);
      });
    }

    /*************************************************************************
     * 4. ETKİLEŞİMLER (SEKME, ARAMA, SEPET, TEMA)
     *************************************************************************/
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.getAttribute("data-tab");
        activeFilter = "Tümü";
        updateNavButtons();
        renderChips();
        renderMain();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    searchInput.addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.style.display = searchQuery ? "block" : "none";
      renderMain();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchQuery = "";
      searchInput.value = "";
      clearSearchBtn.style.display = "none";
      renderMain();
    });

    // Tema Değiştirici (Koyu / Açık Mod)
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("biyoTheme") === "light") {
      document.body.classList.add("light-mode");
      themeToggle.textContent = "🌙";
    }
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      themeToggle.textContent = isLight ? "🌙" : "☀️";
      localStorage.setItem("biyoTheme", isLight ? "light" : "dark");
    });

    // Sepet Modalı Yönetimi
    const cartModal = document.getElementById("cartModal");
    const cartListContainer = document.getElementById("cartListContainer");

    function renderCartModal() {
      if (shoppingCart.length === 0) {
        cartListContainer.innerHTML = `<div class="empty-state">Sepetin henüz boş. Alışveriş sekmesindeki ürünlerin yanındaki <strong>+ Sepet</strong> butonuna basarak buraya ekleyebilirsin.</div>`;
        return;
      }
      cartListContainer.innerHTML = shoppingCart.map((item, index) => `
        <div class="cart-item ${item.checked ? 'checked' : ''}" onclick="toggleCheckCartItem(${index})">
          <span>${item.checked ? '✅' : '⬜'} <strong>${item.name}</strong></span>
          <button class="icon-btn" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); removeCartItem(${index})">Sil</button>
        </div>
      `).join("");
    }

    window.toggleCheckCartItem = function(idx) {
      shoppingCart[idx].checked = !shoppingCart[idx].checked;
      saveCart();
      renderCartModal();
    };

    window.removeCartItem = function(idx) {
      shoppingCart.splice(idx, 1);
      saveCart();
      renderCartModal();
      renderMain();
    };

    document.getElementById("openCartBtn").addEventListener("click", () => {
      renderCartModal();
      cartModal.classList.add("open");
    });

    document.getElementById("closeCartBtn").addEventListener("click", () => {
      cartModal.classList.remove("open");
    });

    document.getElementById("clearCartBtn").addEventListener("click", () => {
      shoppingCart = [];
      saveCart();
      renderCartModal();
      renderMain();
    });

    cartModal.addEventListener("click", e => {
      if (e.target === cartModal) cartModal.classList.remove("open");
    });

    // PWA Service Worker Kaydı (2. Adımda ekleyeceğimiz sw.js dosyasını otomatik çalıştırır)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // İlk Açılış
    updateCartBadge();
    renderChips();
    renderMain();
  </script>
</body>
</html>
