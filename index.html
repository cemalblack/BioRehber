<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BiyoRehber-CK </title>

  <!-- PWA & Mobil Uygulama Meta Etiketleri -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BiyoRehber" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-card-alt: #26354d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #059669;
      --accent: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --purple: #a855f7;
      --border: #334155;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    body.light-mode {
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-alt: #f8fafc;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #059669;
      --primary-dark: #047857;
      --accent: #d97706;
      --danger: #dc2626;
      --info: #2563eb;
      --purple: #7e22ce;
      --border: #cbd5e1;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 88px;
      overflow-x: hidden;
    }

    /* Üst Sabit Başlık ve Arama */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cart-count {
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 99px;
    }

    .search-bar {
      position: relative;
      width: 100%;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 36px 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
    }

    /* Yatay Kaydırılabilir Kategori Çipleri */
    .chips-wrapper {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 14px;
      scrollbar-width: none;
      background: var(--bg);
      position: sticky;
      top: 97px;
      z-index: 90;
      border-bottom: 1px solid var(--border);
    }

    .chips-wrapper::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .chip.trap-chip.active {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* Ana İçerik Alanı */
    main {
      padding: 12px 14px;
      max-width: 740px;
      margin: 0 auto;
    }

    /* Kademe (Tier) Grup Başlıkları */
    .tier-header {
      margin: 18px 0 12px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: var(--shadow);
    }

    .tier-header:first-child {
      margin-top: 4px;
    }

    .tier-header span.tier-sub {
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.9;
    }

    .tier-1 {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--primary);
      border-left: 5px solid var(--primary);
      color: var(--text);
    }

    .tier-2 {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--purple);
      border-left: 5px solid var(--purple);
      color: var(--text);
    }

    .tier-3 {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid var(--accent);
      border-left: 5px solid var(--accent);
      color: var(--text);
    }

    .tier-4 {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--danger);
      border-left: 5px solid var(--danger);
      color: var(--text);
    }

    .section-banner {
      background: var(--bg-card-alt);
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .section-banner strong {
      color: var(--text);
    }

    /* Gıda ve Molekül Kartları */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card.trap-card {
      border-left: 4px solid var(--danger);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-title-area {
      flex: 1;
    }

    .category-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 5px;
      margin-bottom: 4px;
      background: var(--bg-card-alt);
      color: var(--primary);
    }

    .card-title {
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .score-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .specialist-badge {
      background: rgba(168, 85, 247, 0.18);
      color: var(--purple);
      border: 1px solid var(--purple);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .secondary-badge {
      background: rgba(245, 158, 11, 0.18);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .forbidden-badge {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .multiplier-badge {
      background: rgba(245, 158, 11, 0.18);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .add-cart-btn {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-cart-btn.in-cart {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Bilgi Kutuları */
    .info-box {
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 0.86rem;
    }

    .box-surprise {
      background: rgba(245, 158, 11, 0.12);
      border-left: 3px solid var(--accent);
    }

    .box-pick {
      background: rgba(59, 130, 246, 0.12);
      border-left: 3px solid var(--info);
    }

    .box-right {
      background: rgba(16, 185, 129, 0.12);
      border-left: 3px solid var(--primary);
    }

    .box-wrong {
      background: rgba(239, 68, 68, 0.12);
      border-left: 3px solid var(--danger);
    }

    .box-storage {
      background: var(--bg-card-alt);
      border-left: 3px solid var(--purple);
    }

    .box-label {
      font-weight: 800;
      font-size: 0.77rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
      letter-spacing: 0.3px;
    }

    /* Kart İçi Aksiyon Butonları (Mutfak & Tüm Faydaları) */
    .card-action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .card-action-bar.single-action {
      grid-template-columns: 1fr;
    }

    .action-toggle-btn {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .action-toggle-btn.active-kitchen {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .action-toggle-btn.active-benefits {
      background: var(--info);
      border-color: var(--info);
      color: #ffffff;
    }

    .inline-drawer {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .inline-drawer.open {
      display: block;
    }

    .benefit-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 0.84rem;
    }

    .benefit-item:last-child {
      margin-bottom: 0;
    }

    /* Etken Madde Küçük Etiketleri */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .compound-tag {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      cursor: pointer;
    }

    .compound-tag:hover, .compound-tag:active {
      border-color: var(--primary);
      color: var(--primary);
    }

    .ranked-food-btn {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ranked-food-btn.top-rank {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.12);
    }

    .ranked-food-btn:active {
      transform: scale(0.98);
    }

    /* 2. Sekme: Hızlı Seçim Kutuları (Vitamin / Mineral / Özel Molekül) */
    .quick-boxes-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .quick-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .quick-box-title {
      font-size: 0.83rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quick-btns-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-mol-btn {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.79rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quick-mol-btn.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Alt Navigasyon Barı (2 Ana Sekme) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-btn .nav-icon {
      font-size: 1.35rem;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    /* Alışveriş Sepeti Çekmecesi */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 600px;
      max-height: 82vh;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-card-alt);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .cart-item.checked span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Üst Bar -->
  <header>
    <div class="header-top">
      <div class="brand">
        <span>🧬 BiyoRehber</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Tema Değiştir">☀️</button>
        <button class="icon-btn" id="openCartBtn">
          🛒 Sepet <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Gıda, vitamin, molekül veya yasaklı ürün ara... (Örn: nutella, pancar, zeytin, kefir)" />
      <button class="clear-search" id="clearSearchBtn">✕</button>
    </div>
  </header>

  <!-- Kategori Filtre Çipleri -->
  <div class="chips-wrapper" id="chipsContainer"></div>

  <!-- Ana Liste İçeriği -->
  <main id="mainContent"></main>

  <!-- Alt 2'li Sekme Menüsü -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="shopping">
      <span class="nav-icon">🛒</span>
      <span>1. Alışveriş & Seçim</span>
    </button>
    <button class="nav-btn" data-tab="targets">
      <span class="nav-icon">🎯</span>
      <span>2. Vitamin & Hedef</span>
    </button>
  </nav>

  <!-- Alışveriş Sepeti Modalı -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>🛒 Alışveriş Listem</h3>
        <div style="display:flex; gap:8px;">
          <button class="icon-btn" id="clearCartBtn" style="color:var(--danger);">Temizle</button>
          <button class="icon-btn" id="closeCartBtn">Kapat ✕</button>
        </div>
      </div>
      <div class="modal-body" id="cartListContainer"></div>
    </div>
  </div>

  <script>
    /*************************************************************************
     * 1. ETKEN MADDELER, VİTAMİNLER VE MİNERALLER VERİTABANI
     * (rankedSources: O maddeyi gerçek porsiyonda ve 6 kritere göre en verimli

        rankedSources: ["kabak_aycekirdegi", "cig_findik", "sekersiz_findik_ezmesi", "zeytin_zeytinyagi", "tahin", "findik_badem_fistik", "brezilya_cevizi"]

      {

      },
      {
        name: "Folat (B9)",
        group: "Vitaminler",
        role: "DNA sentezi, yeni kan hücresi üretimi ve damar duvarını yaralayan toksik 'Homosistein' amino asidinin temizlenmesi için şarttır.",
        tip: "Mercimek, nohut ve bulgur pişse bile folatını korur; roka, tere ve maydanoz ise en pratik çiğ folat kaynağıdır.",
        rankedSources: ["mercimek_nohut", "kavanoz_bakliyat_sebze", "roka_tere", "kirmizi_pancar", "bulgur", "maydanoz", "enginar", "pirasa", "ceviz", "brokoli_karnabahar", "kuru_fasulye_barbunya"]

    function saveCart() {
      localStorage.setItem("biyoRehberCart", JSON.stringify(shoppingCart));
      cartCountEl.textContent = shoppingCart.length;
    }

    window.toggleCartItem = function(foodId, foodName) {
      const idx = shoppingCart.findIndex(item => item.id === foodId);
      if (idx > -1) shoppingCart.splice(idx, 1);
      else shoppingCart.push({ id: foodId, name: foodName, checked: false });
      saveCart();
      renderMain();
    };

    window.toggleDrawer = function(foodId, type) {
      const kitchenDrawer = document.getElementById(`drawer-kitchen-${foodId}`);
      const benefitsDrawer = document.getElementById(`drawer-benefits-${foodId}`);
      const kitchenBtn = document.getElementById(`btn-kitchen-${foodId}`);
      const benefitsBtn = document.getElementById(`btn-benefits-${foodId}`);

      if (type === "kitchen") {
        const isOpen = kitchenDrawer.classList.contains("open");
        kitchenDrawer.classList.toggle("open", !isOpen);
        kitchenBtn.classList.toggle("active-kitchen", !isOpen);
        if (benefitsDrawer) benefitsDrawer.classList.remove("open");
        if (benefitsBtn) benefitsBtn.classList.remove("active-benefits");
      } else if (benefitsDrawer && benefitsBtn) {
        const isOpen = benefitsDrawer.classList.contains("open");
        benefitsDrawer.classList.toggle("open", !isOpen);
        benefitsBtn.classList.toggle("active-benefits", !isOpen);
        if (kitchenDrawer) kitchenDrawer.classList.remove("open");
        if (kitchenBtn) kitchenBtn.classList.remove("active-kitchen");
      }
    };

    window.jumpToFoodCard = function(foodId) {
      const food = FOODS_DB.find(f => f.id === foodId);
      if (!food) return;
      currentTab = "shopping";
      activeFilter = food.category;
      searchQuery = "";
      searchInput.value = "";
      clearSearchBtn.style.display = "none";
      updateNavButtons();
      renderChips();
      renderMain();
      setTimeout(() => {
        const el = document.getElementById(`food-card-${foodId}`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          toggleDrawer(foodId, "kitchen");
        }
      }, 80);
    };

    function renderChips() {
      const filters = TAB_FILTERS[currentTab];
      chipsContainer.innerHTML = filters.map(f => {
        const isTrap = f.includes("Tuzak");
        const activeClass = f === activeFilter ? "active" : "";
        const trapClass = isTrap ? "trap-chip" : "";
        return `<button class="chip ${activeClass} ${trapClass}" data-filter="${f}">${f}</button>`;
      }).join("");

      chipsContainer.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          activeFilter = btn.getAttribute("data-filter");
          renderChips();
          renderMain();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function matchesSearch(item) {
      if (!searchQuery) return true;
      const q = searchQuery.toLocaleLowerCase("tr-TR");
      return JSON.stringify(item).toLocaleLowerCase("tr-TR").includes(q);
    }

        badgeHTML = `<span class="secondary-badge">⚖️ 2. Derece (Şartlı)</span>`;

      const detailedBenefitsHTML = item.molecules.map(mName => {

        return `
          <div class="benefit-item">
            <div style="font-weight:800; color:var(--primary); margin-bottom:2px;">🧪 ${molObj.name} <span style="font-size:0.72rem; color:var(--text-muted);">(${molObj.group})</span></div>

          <div class="card-header">
            <div class="card-title-area">
              <span class="category-tag" style="${isForbidden ? 'color:var(--danger);' : ''}">${item.category}</span>
              <div class="card-title">
                ${item.name}
                ${badgeHTML}
              </div>
              <div style="font-size:0.78rem; color:var(--text-muted); margin-top:2px;">
                📏 İdeal Porsiyon: <strong>${item.portion}</strong>
              </div>
            </div>
            ${!isForbidden ? `
              <button class="add-cart-btn ${inCart ? 'in-cart' : ''}" onclick="toggleCartItem('${item.id}', '${item.name.replace(/'/g, "\\'")}')">
                ${inCart ? '✓ Sepette' : '+ Sepet'}
              </button>
            ` : ''}
          </div>

          <div class="info-box ${isForbidden ? 'box-wrong' : 'box-surprise'}">
            <span class="box-label" style="color:${isForbidden ? 'var(--danger)' : 'var(--accent)'};">
              ${isForbidden ? '🚨 Neden Yasak? (Biyolojik Hasar Analizi)' : '💡 Şaşırtıcı Gerçek & Biyolojik Gücü'}
            </span>
            ${item.surprise.replace(/\n/g, "<br>")}
          </div>

          <div class="info-box box-pick">
            <span class="box-label" style="color:var(--info);">🔍 Reyonda Seçim & Etiket Uyarısı</span>
            ${item.selection}
          </div>

          <div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px; padding-left:4px;">
            ⚖️ <strong>6 Kısıt Notu:</strong> ${item.constraintNote}
          </div>

          ${!isForbidden ? `
            <!-- Küçük Etken Madde Etiketleri (Sadece Sağlıklı Gıdalarda) -->
            <div class="tags-row">
              ${item.molecules.map(m => `<span class="compound-tag" onclick="jumpToMoleculeTab('${m}')">🧪 ${m}</span>`).join("")}
            </div>
          ` : ''}

          <!-- Akıllı Aksiyon Butonları (Yasaklı Gıdalarda Tek Buton, Sağlıklı Gıdalarda 2 Buton) -->
          <div class="card-action-bar ${isForbidden ? 'single-action' : ''}">
            <button class="action-toggle-btn" id="btn-kitchen-${item.id}" onclick="toggleDrawer('${item.id}', 'kitchen')">
              ${isForbidden ? '🔄 Sağlıklı Alternatifi' : '🍽️ Mutfak & Tüketim'}
            </button>
            ${!isForbidden ? `
              <button class="action-toggle-btn" id="btn-benefits-${item.id}" onclick="toggleDrawer('${item.id}', 'benefits')">
                🧬 Tüm Faydaları (${item.molecules.length})
              </button>
            ` : ''}
          </div>

          <!-- Açılır Çekmece 1: Mutfak & Emilim Kuralları / Sağlıklı Alternatif -->
          <div class="inline-drawer" id="drawer-kitchen-${item.id}">
            <div class="multiplier-badge">🚀 ${item.multiplierBadge}</div>
            <div class="info-box box-right" style="margin-top:4px;">
              <span class="box-label" style="color:var(--primary);">
                ${isForbidden ? '✅ Sağlıklı Ev Alternatifi & Uygulama' : '✅ Doğru Hazırlama, Pişirme, Eşleştirme & Zamanlama'}
              </span>
              ${item.rightMethod.replace(/\n/g, "<br>")}
            </div>
            <div class="info-box box-wrong">
              <span class="box-label" style="color:var(--danger);">❌ Yaygın Hata (Bunu Yapma!)</span>
              ${item.wrongMethod}
            </div>
            <div class="info-box box-storage">
              <span class="box-label" style="color:var(--purple);">❄️ Saklama & Sıfır Fire Kuralı</span>
              ${item.storage}
            </div>
          </div>

          ${!isForbidden ? `
            <!-- Açılır Çekmece 2: Tüm Faydaları ve Vücut Sistemleri -->
            <div class="inline-drawer" id="drawer-benefits-${item.id}">
              <div style="font-size:0.8rem; font-weight:800; color:var(--info); margin-bottom:8px;">
                🩺 HEDEF VÜCUT SİSTEMLERİ: ${item.systems.join(" • ")}
              </div>
              ${detailedBenefitsHTML}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderShoppingTab() {
      if (searchQuery) {
        const results = FOODS_DB.filter(matchesSearch);
        mainContent.innerHTML = results.length
          ? `<div class="section-banner"><strong>🔍 Arama Sonuçları (${results.length} kayıt bulundu):</strong></div>` + results.map(buildFoodCardHTML).join("")
          : `<div class="empty-state">Aramanızla eşleşen gıda bulunamadı.</div>`;
        return;
      }

      if (activeFilter === "🚫 Tuzaklar") {
        let html = `
          <div class="section-banner" style="border-left-color: var(--danger);">
            <strong>🚫 6 Kriter Eleğine Takılan Reyon Tuzakları & Yasaklar:</strong> Popüler olduğu halde şeker, palm yağı, nitrit, fiyat, hacim veya sıfır emilim nedeniyle elenen ürünler ve doğru alternatifleri.
          </div>
        `;
        html += TRAPS_DB.map(t => `
          <div class="card trap-card">
            <span class="category-tag" style="color:var(--danger);">${t.category}</span>
            <div class="card-title" style="margin-bottom:8px;">❌ ${t.name}</div>
            <div class="info-box box-wrong">
              <span class="box-label" style="color:var(--danger);">Neden Elendi / Yasaklandı? (Kısıt & Toksisite Analizi)</span>
              ${t.reason}
            </div>
            <div class="info-box box-right">
              <span class="box-label" style="color:var(--primary);">✅ 6 Kriteri Geçen Şampiyon Alternatifi</span>
              ${t.alternative}
            </div>
          </div>
        `).join("");
        mainContent.innerHTML = html;
        return;
      }

      const categoryItems = FOODS_DB.filter(f => f.category === activeFilter);
      const tier1 = categoryItems.filter(f => f.tier === 1).sort((a, b) => (b.score || 0) - (a.score || 0));
      const tier2 = categoryItems.filter(f => f.tier === 2);
      const tier3 = categoryItems.filter(f => f.tier === 3);
      const tier4 = categoryItems.filter(f => f.tier === 4);

      let html = "";

      if (tier1.length > 0) {
        html += `
          <div class="tier-header tier-1">
            <div>🏆 1. Derece: Ana Tercihler (${activeFilter} Şampiyonları)</div>
            <span class="tier-sub">6 kriterin tamamını (fiyat, pratiklik, hacim, sıfır fire ve yüksek yoğunluk) geçen günlük baz gıdalar.</span>
          </div>
          ${tier1.map(buildFoodCardHTML).join("")}
        `;
      }

      if (tier2.length > 0) {
        html += `
          <div class="tier-header tier-2">
            <div>💎 Özel Görev Gıdaları (İkamesiz Uzmanlar)</div>
            <span class="tier-sub">İçerdiği özel etken madde başka hiçbir gıdada bulunmadığı için belirli organları onarmak adına alınanlar.</span>
          </div>
          ${tier2.map(buildFoodCardHTML).join("")}
        `;
      }

      if (tier3.length > 0) {
        html += `
          <div class="tier-header tier-3">
            <div>⚖️ 2. Derece Seçenekler (Şartlı / Sık Tüketilenler)</div>
            <span class="tier-sub">Alışkanlıkla sık alınan ancak şeker yükü, hazırlık veya gaz kısıtı nedeniyle özel mutfak kuralıyla yenmesi gerekenler.</span>
          </div>
          ${tier3.map(buildFoodCardHTML).join("")}
        `;
      }

      if (tier4.length > 0) {
        html += `
          <div class="tier-header tier-4">
            <div>🚫 Kırmızı Çizgi: Yasaklı Hazır Gıdalar (Asla Alma!)</div>
            <span class="tier-sub">Yüksek şeker, kanserojen palm yağı (3-MCPD), nitrit veya fosfat tuzu içeren paketli tuzaklar ve 10 saniyelik ev alternatifleri.</span>
          </div>
          ${tier4.map(buildFoodCardHTML).join("")}
        `;
      }

      mainContent.innerHTML = html || `<div class="empty-state">Bu kategoride gıda bulunamadı.</div>`;
    }

    function renderTargetsTab() {
      if (searchQuery) {
        const matchingMols = MOLECULES_DB.filter(matchesSearch);
        mainContent.innerHTML = matchingMols.length
          ? matchingMols.map(buildMoleculeCardHTML).join("")
          : `<div class="empty-state">Aramanızla eşleşen vitamin, mineral veya etken madde bulunamadı.</div>`;
        return;
      }

      if (activeFilter === "Hızlı Rehber (Kutu Seçimi)") {
        const vitamins = MOLECULES_DB.filter(m => m.group === "Vitaminler");
        const minerals = MOLECULES_DB.filter(m => m.group === "Mineraller");
        const specials = MOLECULES_DB.filter(m => m.group === "Özel Moleküller");
        const selectedMolObj = MOLECULES_DB.find(m => m.name === selectedQuickMolecule) || MOLECULES_DB[0];

        let html = `
          <div class="section-banner">
            <strong>🎯 Hızlı Vitamin, Mineral ve Etken Madde Seçici:</strong> Aşağıdaki kutulardan merak ettiğin maddeye dokun; ne işe yaradığı ve gerçek porsiyonda en verimli alacağın gıda sıralaması hemen altında açılsın.
          </div>

          <div class="quick-boxes-wrapper">
            <!-- Kutu 1: Vitaminler -->
            <div class="quick-box" style="border-left: 4px solid var(--primary);">
              <div class="quick-box-title" style="color:var(--primary);">💊 1. Temel Vitaminler</div>
              <div class="quick-btns-grid">
                ${vitamins.map(v => `<button class="quick-mol-btn ${v.name === selectedMolObj.name ? 'selected' : ''}" onclick="selectQuickMol('${v.name.replace(/'/g, "\\'")}')">${v.name}</button>`).join("")}
              </div>
            </div>

            <!-- Kutu 2: Mineraller -->
            <div class="quick-box" style="border-left: 4px solid var(--accent);">
              <div class="quick-box-title" style="color:var(--accent);">⚡ 2. Kritik Mineraller</div>
              <div class="quick-btns-grid">
                ${minerals.map(m => `<button class="quick-mol-btn ${m.name === selectedMolObj.name ? 'selected' : ''}" onclick="selectQuickMol('${m.name.replace(/'/g, "\\'")}')">${m.name}</button>`).join("")}
              </div>
            </div>

            <!-- Kutu 3: Özel Moleküller & Flavonoidler -->
            <div class="quick-box" style="border-left: 4px solid var(--purple);">
              <div class="quick-box-title" style="color:var(--purple);">🧬 3. Özel Moleküller, Enzimler & Flavonoidler</div>
              <div class="quick-btns-grid">
                ${specials.map(s => `<button class="quick-mol-btn ${s.name === selectedMolObj.name ? 'selected' : ''}" onclick="selectQuickMol('${s.name.replace(/'/g, "\\'")}')">${s.name}</button>`).join("")}
              </div>
            </div>
          </div>

          <!-- Seçilen Molekülün Detay Kartı -->
          <div id="selectedMolCard">
            ${buildMoleculeCardHTML(selectedMolObj)}
          </div>
        `;
        mainContent.innerHTML = html;
        return;
      }

      const matchingFoods = FOODS_DB.filter(f => f.systems.includes(activeFilter) && f.tier !== 4);
      let html = `
        <div class="section-banner">
          <strong>🩺 Hedef Sistem (${activeFilter}):</strong> Bu organ/sistemi doğrudan onaran gıdalar (Mutfak ve fayda detayları için kartın altındaki butonlara dokun).
        </div>
        ${matchingFoods.map(buildFoodCardHTML).join("")}
      `;
      mainContent.innerHTML = html || `<div class="empty-state">Sonuç bulunamadı.</div>`;
    }

    // Maddeye Özgü 6 Kriterli Porsiyon Sıralamasıyla Molekül Kartı Oluşturucu
    function buildMoleculeCardHTML(mol) {
      let orderedFoods = [];

      if (mol.rankedSources && mol.rankedSources.length > 0) {
        mol.rankedSources.forEach(foodId => {
          const found = FOODS_DB.find(f => f.id === foodId && f.tier !== 4);
          if (found) orderedFoods.push(found);
        });
      }

      FOODS_DB.forEach(f => {
        if (f.tier !== 4 && f.molecules.includes(mol.name) && !orderedFoods.some(o => o.id === f.id)) {
          orderedFoods.push(f);
        }
      });

      const foodButtons = orderedFoods.map((f, idx) => {
        let rankLabel = `#${idx + 1}`;
        if (idx === 0) rankLabel = "🥇 #1";
        else if (idx === 1) rankLabel = "🥈 #2";
        else if (idx === 2) rankLabel = "🥉 #3";

        const topClass = idx < 3 ? "top-rank" : "";
        return `
          <button class="ranked-food-btn ${topClass}" onclick="jumpToFoodCard('${f.id}')">
            <span style="color:var(--accent); font-weight:900;">${rankLabel}</span>
            <span>${f.name} →</span>
          </button>
        `;
      }).join("");

      return `
        <div class="card" style="border: 2px solid var(--primary);">
          <span class="category-tag">${mol.group} • Seçili Rehber</span>
          <div class="card-title" style="font-size:1.2rem; margin-bottom:8px;">🧬 ${mol.name}</div>

          <div class="info-box box-pick">
            <span class="box-label" style="color:var(--info);">Vücuttaki Biyolojik Görevi (Ne İşe Yarar?)</span>
            ${mol.role}
          </div>

          <div class="info-box box-right">
            <span class="box-label" style="color:var(--primary);">🔑 Kritik Emilim & Porsiyon Kuralı</span>
            ${mol.tip}
          </div>

          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);">
            <div style="font-size:0.78rem; color:var(--text-muted); font-weight:800; margin-bottom:8px;">
              🥗 GERÇEK PORSİYON & 6 KRİTER VERİMİNE GÖRE EN İYİ KAYNAKLAR (Tıkla & Gıdaya Git):
            </div>
            <div class="tags-row" style="margin-top:0; gap:8px;">
              ${foodButtons || `<span style="font-size:0.82rem; color:var(--text-muted);">Güneş ışığı veya doğrudan takviye gerektirir.</span>`}
            </div>
          </div>
        </div>
      `;
    }

    function renderMain() {
      if (currentTab === "shopping") renderShoppingTab();
      else if (currentTab === "targets") renderTargetsTab();
    }

    function updateNavButtons() {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === currentTab);
      });
    }

    /*************************************************************************
     * 4. ETKİLEŞİMLER (ALT MENÜ, ARAMA, SEPET, TEMA)
     *************************************************************************/
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.getAttribute("data-tab");
        activeFilter = TAB_FILTERS[currentTab][0];
        updateNavButtons();
        renderChips();
        renderMain();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    searchInput.addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.style.display = searchQuery ? "block" : "none";
      renderMain();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchQuery = "";
      searchInput.value = "";
      clearSearchBtn.style.display = "none";
      renderMain();
    });

    // Tema Değiştirici (Koyu / Açık Mod)
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("biyoTheme") === "light") {
      document.body.classList.add("light-mode");
      themeToggle.textContent = "🌙";
    }
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      themeToggle.textContent = isLight ? "🌙" : "☀️";
      localStorage.setItem("biyoTheme", isLight ? "light" : "dark");
    });

    // Sepet Modalı Yönetimi
    const cartModal = document.getElementById("cartModal");
    const cartListContainer = document.getElementById("cartListContainer");

    function renderCartModal() {
      if (shoppingCart.length === 0) {
        cartListContainer.innerHTML = `<div class="empty-state">Sepetin henüz boş. Alışveriş sekmesindeki ürünlerin yanındaki <strong>+ Sepet</strong> butonuna basarak buraya ekleyebilirsin.</div>`;
        return;
      }
      cartListContainer.innerHTML = shoppingCart.map((item, index) => `
        <div class="cart-item ${item.checked ? 'checked' : ''}" onclick="toggleCheckCartItem(${index})">
          <span>${item.checked ? '✅' : '⬜'} <strong>${item.name}</strong></span>
          <button class="icon-btn" style="padding:4px 8px; font-size:0.75rem;" onclick="event.stopPropagation(); removeCartItem(${index})">Sil</button>
        </div>
      `).join("");
    }

    window.toggleCheckCartItem = function(idx) {
      shoppingCart[idx].checked = !shoppingCart[idx].checked;
      saveCart();
      renderCartModal();
    };

    window.removeCartItem = function(idx) {
      shoppingCart.splice(idx, 1);
      saveCart();
      renderCartModal();
      renderMain();
    };

    document.getElementById("openCartBtn").addEventListener("click", () => {
      renderCartModal();
      cartModal.classList.add("open");
    });

    document.getElementById("closeCartBtn").addEventListener("click", () => {
      cartModal.classList.remove("open");
    });

    document.getElementById("clearCartBtn").addEventListener("click", () => {
      shoppingCart = [];
      saveCart();
      renderCartModal();
      renderMain();
    });

    cartModal.addEventListener("click", e => {
      if (e.target === cartModal) cartModal.classList.remove("open");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // İlk Açılış
    saveCart();
    renderChips();
    renderMain();
  </script>
</body>
</html>
