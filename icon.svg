<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Uygulama İkonu Arka Planı -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#334155" stroke-width="6" />

  <!-- Biyolojik Yaprak Gövdesi -->
  <path d="M 140 372 C 140 200, 260 120, 385 125 C 390 250, 310 372, 140 372 Z" fill="url(#leafGrad)" />

  <!-- Yaprak Damarı ve Molekül Bağları -->
  <path d="M 135 377 Q 255 255 345 165" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <path d="M 220 292 L 190 230" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
  <path d="M 275 237 L 335 260" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />

  <!-- Molekül Düğümleri (Altın Sarısı Emilim Çarpanı) -->
  <circle cx="190" cy="230" r="18" fill="#f59e0b" stroke="#0f172a" stroke-width="6" />
  <circle cx="335" cy="260" r="18" fill="#f59e0b" stroke="#0f172a" stroke-width="6" />
  <circle cx="345" cy="165" r="22" fill="#f59e0b" stroke="#0f172a" stroke-width="6" />

  <!-- 6 Kriter / Çarpan Rozeti -->
  <circle cx="370" cy="370" r="62" fill="#f59e0b" stroke="#0f172a" stroke-width="10" />
  <text x="370" y="388" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#0f172a" text-anchor="middle">6x</text>
